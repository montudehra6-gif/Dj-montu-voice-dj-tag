<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Montu Mixer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>DJ Montu Voice Tag Maker</h1>
    <p id="status">Website ready hai!</p>
    <button onclick="showMessage()">Click Karein</button>

    <script>
        function showMessage() {
            document.getElementById("status").innerText = "JavaScript successfully load ho gaya hai!";
        }
    </script>

</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Selection</title>
    <style>
        body { font-family: sans-serif; background-color: #f9f9f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        h2 { text-align: center; color: #333; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card { background: white; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card-header { background: #00b06b; color: white; padding: 8px 0; font-size: 14px; font-weight: bold; }
        .play-btn { font-size: 32px; color: #ff3333; cursor: pointer; margin: 15px 0 5px 0; display: block; }
        .card-name { font-weight: bold; margin-bottom: 5px; }
        .card-credits { color: #f0ad4e; font-size: 14px; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Voice Maker - Online</h2>
    <div class="grid">
        <div class="card">
            <div class="card-header">Select Voice</div>
            <span class="play-btn">&#9658;</span>
            <div class="card-name">Priya (Female)</div>
            <div class="card-credits">500 CREDITS</div>
        </div>
        <div class="card">
            <div class="card-header">Select Voice</div>
            <span class="play-btn">&#9658;</span>
            <div class="card-name">Riya (Female)</div>
            <div class="card-credits">500 CREDITS</div>
        </div>
    </div>
</div>

</body>
</html>
